[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-link-prediction-experiments"
version = "0.1.0"
description = "Explainable prediction of emerging scientific connections and bibliometric disruption estimation (preliminary experiments)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Avelar Rodrigues de Sousa" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "tenacity>=8.2",
    "platformdirs>=4.0",
    "tqdm>=4.66",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "yake>=0.4.8",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
viz = ["seaborn>=0.13"]
# KeyBERT (optional comparison) pulls sentence-transformers/torch — heavy; install
# only when running the YAKE-vs-KeyBERT comparison.
nlp = ["keybert>=0.8", "sentence-transformers>=2.6"]
graph = ["python-igraph>=0.11"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21", "mypy>=1.8", "ruff>=0.3"]

[project.scripts]
slpe-characterize-fields = "slpe.cli.characterize_fields:main"
slpe-report-fields = "slpe.cli.report_characterization:main"
slpe-sample-quality = "slpe.cli.sample_quality:main"
slpe-weighted-fields = "slpe.cli.weighted_fields:main"
slpe-collect-pilot = "slpe.cli.collect_pilot:main"
slpe-collect-pdfs-pilot = "slpe.cli.collect_pdfs_pilot:main"
slpe-run-linkpred = "slpe.cli.run_linkpred:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["slpe"]
ignore_missing_imports = true
