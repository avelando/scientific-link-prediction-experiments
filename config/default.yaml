# Central configuration for the preliminary experiments.
# Every stage reads from a config like this so that areas, temporal windows,
# hyperparameters, seeds and paths live in one place (project requirement 10).
#
# NOTE ON STATUS:
#   - "project" keys encode decisions already fixed in the PhD research project.
#   - "experiment" keys encode the preliminary-experiment choices we are proposing now.
# This separation keeps established methodology distinct from our extensions.

seed: 20260101            # global RNG seed; stochastic components also take per-run seeds

openalex:
  base_url: "https://api.openalex.org"
  # Contact email for the polite pool. Overridden by env OPENALEX_MAILTO if set.
  # Do NOT hard-code a personal address here if the config is shared publicly.
  mailto: null
  # API key is read ONLY from env OPENALEX_API_KEY (never stored here).
  per_page: 200            # OpenAlex max page size
  max_retries: 5
  backoff_initial_seconds: 1.0
  backoff_max_seconds: 60.0
  timeout_seconds: 30.0
  # Persistent on-disk cache for GET responses (keyed by normalized URL).
  cache_dir: "data/openalex_cache"
  cache_enabled: true
  # Minimum seconds between requests (client-side throttle; polite pool ~10 req/s).
  min_interval_seconds: 0.11

paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_processed: "data/processed"
  results: "results"
  logs: "logs"

# ---------------------------------------------------------------------------
# Corpus definition — which document types count, and the English-abstract rule.
# The project's focal corpus is scientific articles with English title+abstract
# and usable dates (§4.1). Types are configurable so the choice is explicit and
# auditable, and a sensitivity set lets us compare against a conference-inclusive
# corpus (important for Computer Science).
# ---------------------------------------------------------------------------
corpus:
  # OpenAlex work `type` values that make up the primary (focal) corpus.
  types: ["article"]
  # Alternative corpus for the sensitivity comparison (e.g. include conferences).
  sensitivity_types: ["article", "conference-paper"]
  # Require English + a (metadata-flagged) abstract for the SEMANTIC corpus.
  require_english_abstract: true

# ---------------------------------------------------------------------------
# Stage 1 — field characterization and domain selection (what this phase runs).
# ---------------------------------------------------------------------------
characterization:
  # Years over which to profile each field. The three temporal cuts below live
  # inside this range, so the same characterization covers all of them.
  year_min: 2013
  year_max: 2022
  # Candidate fields explicitly named in the project brief as starting points.
  # Characterization still runs over ALL 26 fields; these are only highlighted.
  candidate_field_ids: [17, 31, 27]   # Computer Science, Physics and Astronomy, Medicine
  # Eligibility is reported as SEPARATE criteria, not one opaque boolean. None of
  # them uses model accuracy (project requirement: selection must not depend on
  # the test set). Subfield COUNT is descriptive only — never an eliminatory gate
  # (an absolute minimum penalises fields with coarse OpenAlex taxonomies such as
  # Physics and Astronomy). Thematic breadth is instead summarised by normalized
  # subfield entropy, reported for inspection.
  eligibility:
    # Volume of the SEMANTIC corpus (type + en + abstract) in the smallest cut's
    # history window — enough examples to build networks and candidate pairs.
    min_semantic_eligible_per_cut: 20000
    # Metadata coverage of English abstracts among corpus-type works.
    min_english_abstract_fraction: 0.5
    # Reference coverage (bibliometric readiness) among semantic-corpus works.
    # Flags "bibliometric-ready"; it does NOT remove a field from the semantic corpus.
    min_with_references_fraction: 0.5

# ---------------------------------------------------------------------------
# Temporal protocol (project 4.1 / 4.5). Established in the project; values here
# are the preliminary-experiment defaults.
# ---------------------------------------------------------------------------
temporal:
  history_window_years: 5     # L (project default; 3 and 7 explored later as sensitivity)
  emergence_horizon_years: 1  # Delta_e
  disruption_horizon_years: 3 # Delta_d (exploratory availability study in this phase)
  # Earliest year of OBSERVED history for the novelty check (§4.1). It must match
  # what was actually COLLECTED: the preliminary corpus spans 2013-2022, so novelty
  # is defined over [2013, T] and results are qualified as "new co-occurrences in
  # the sampled historical corpus", NOT globally novel in the literature. Declaring
  # 2000 here while only collecting 2013-2022 would be inconsistent; set this to the
  # true earliest collected year. Extending before 2013 is a separate, budgeted step.
  full_history_start: 2013
  # Retrospective cuts: build features from [cut-L+1, cut], evaluate emergence in (cut, cut+Delta_e].
  cuts:
    - { name: "2017_to_2018", history_start: 2013, cut: 2017, emergence_year: 2018 }
    - { name: "2019_to_2020", history_start: 2015, cut: 2019, emergence_year: 2020 }
    - { name: "2021_to_2022", history_start: 2017, cut: 2021, emergence_year: 2022 }

# ---------------------------------------------------------------------------
# Later stages (placeholders kept so config stays the single source of truth).
# Not consumed in this phase; documented to keep the architecture extensible.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# PDF acquisition + full-text extraction (Stage 2, Phase B). Free sources only.
# ---------------------------------------------------------------------------
pdf:
  dir: "data/pdfs"
  timeout_seconds: 30
  max_retries: 2
  max_bytes_per_file: 52428800     # 50 MB hard cap per file
  per_host_delay_seconds: 1.0      # politeness delay between hits to the same host
  min_text_chars: 500              # below this -> treated as scanned / no text layer
  allow_content_api: false         # OpenAlex paid content API — OFF by default
  grobid_url: null                 # optional GROBID server (e.g. http://localhost:8070)
  # Budget ceilings for a full run (the pilot CLI uses its own small caps):
  max_pdfs: null
  max_total_bytes: null

concepts:
  extractor: "yake"           # {yake, keybert}; compared in stage 3
  max_concepts_per_doc: 15
disruption:
  label_aggregation: "median" # project primary label; mean / first-occurrence as robustness
